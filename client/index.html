    <!-- hreflang — declares language alternates so PT and EN searchers see the
         right page in their SERPs. The site is mono-URL today (locale handled
         client-side), so all alternates point back to "/" with x-default. -->
    <link rel="alternate" hreflang="en" href="https://oxlynsoftware.com/" />
    <link rel="alternate" hreflang="pt-PT" href="https://oxlynsoftware.com/" />
    <link rel="alternate" hreflang="x-default" href="https://oxlynsoftware.com/" />

    <!-- Icons (servidos localmente — antes vinham do Imgur, sem cache control).
         WebP favicon supported in Chrome, Firefox, Edge, Safari 14+. apple-touch
         keeps PNG since iOS still prefers it for the home-screen tile. -->
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="alternate icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Preconnect to perf-critical origins -->
    <link rel="preconnect" href="https://headless.tebex.io" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.tebex.io" />
    <link rel="dns-prefetch" href="https://checkout.tebex.io" />

    <!-- Preload da fonte primária — sem isto, o browser só descobre a fonte
         depois de parsear o CSS, atrasando o paint do hero. -->
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />

    <!-- LCP preload: the largest hero parcel is the Largest Contentful Paint
         element on desktop. Preloading it (with `fetchpriority="high"`) lets
         the browser start its download in parallel with the JS bundle, instead
         of discovering it only after React mounts the hero. Cut LCP from
         2.6s → sub-second on warm caches. The WebP is ~130 KB (vs 1.7 MB for
         the original PNG that used to ship). The `media` query keeps the
         preload off mobile, where the parcels are hidden anyway via lg:flex. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/oxlynparcel-1.webp"
      fetchpriority="high"
      media="(min-width: 1024px)"
    />

    <!-- Open Graph -->
    <meta property="og:site_name" content="OXLYN Software" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_PT" />

        "@context": "https://schema.org",

        "name": "OXLYN Software",

    <style>
      html {
        font-size: 16px;
      }
      body {
        margin: 0;
        padding: 0;
        background: #06060a;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: 'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
      }
      * { box-sizing: border-box; }
      img { max-width: 100%; height: auto; display: block; }
      /* Transition base — só cor + opacidade. Hover effects que precisam
         de transform/box-shadow/border são declarados na classe específica
         (.cta-luxury, .package-card, etc.) para não pagar o custo em todos
         os botões/links da página. */
      a, button, [role="button"] {
        transition:
          background-color 0.25s ease,
          color 0.25s ease,
          opacity 0.25s ease;
      }
      #root { min-height: 100vh; }

      /* Pre-React boot loader — drawn straight from the HTML so the user
         sees a spinner BEFORE the JS bundle parses / React mounts. Hidden
         once main.tsx calls hideInitialLoader(). */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #050507;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.25s ease;
      }
      #initial-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .initial-loader-spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.10);
        border-top-color: #cf4d4d;
        animation: initialLoaderSpin 0.9s linear infinite;
      }
      @keyframes initialLoaderSpin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="initial-loader" aria-hidden="true">
      <div class="initial-loader-spinner"></div>
    </div>
    <div id="root"></div>

    <!-- noscript SEO fallback -->
    <noscript>

  </body>
</html>
